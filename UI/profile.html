<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>employee-profile</title>
</head>

<body>
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div style="background-color: rgba(179, 196, 248, 0.234); border: none;" class="card p-5">

            <div class="card p-2 shadow-lg" style="background-color: aliceblue;">
                <h2 class="fw-bold mt-2 mx-5 mb-3">Welcome </h2>
                <div class="justify-content-center">
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2 ">Name :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Employee ID :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Username :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Email ID:</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Mobile :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Gender :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Department :</h5>
                    <h5 style="color: rgb(55, 109, 209);" class="text-start fw-bold fs-6 mb-2">Joining Date :</h5>

                    <div class="d-flex justify-content-center gap-4 my-3">
                        <button style="background-color: rgb(3, 98, 38); color: white;"
                            class="btn border flex-fill fw-bold">Edit Profile</button>
                        <button class="btn border fw-bold bg-warning flex-fill">Back To Dashboard</button>

                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
