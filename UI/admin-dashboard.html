<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ddd;
            /* optional */
        }

        .nav-item:hover {
            background-color: #cdcdff5a;
        }

        .nav-item a:hover {
            color: #702EA9;
        }
    </style>
    <title>Admin-Dashboard</title>
</head>

<body>
    <nav class="navbar fixed-top py-3" style="background-color: #702EA9;">
        <div class="container-fluid">

            <!-- Hamburger at start -->
            <button class="navbar-toggler me-2" style="background-color: #CDCDFF; border: 2px solid white;"
                type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar"
                aria-controls="offcanvasNavbar" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <h3 class="mb-0 position-absolute start-50 translate-middle-x fw-bold" style="color: #CDCDFF;">
                Admin Dashboard
            </h3>

            <!-- Push logout button to right -->
            <div class="ms-auto">
                <button class="btn fw-bold text-danger"
                    style="background: #CDCDFF; border:2px solid white;">Logout</button>
            </div>

            <!-- Offcanvas -->
            <div class="offcanvas offcanvas-start" style="background-color: #702EA9;" tabindex="-1" id="offcanvasNavbar"
                aria-labelledby="offcanvasNavbarLabel">

                <div class="offcanvas-header" style="background: #CDCDFF;">
                    <h5 class="offcanvas-title fw-bold" style="color: #702EA9;" id="offcanvasNavbarLabel">
                        Admin Menu
                    </h5>

                    <button type="button" class="btn-close " data-bs-dismiss="offcanvas" aria-label="Close">
                    </button>
                </div>

                <div class="offcanvas-body">

                    <!-- Profile Section -->
                    <div class="text-center mb-4">
                        <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" alt="Profile"
                            class="profile-img">

                        <h4 class="mt-3 mb-0 text-white fw-bold">John Doe</h4>
                        <h6 class="text-white fw-light fs-6">admin@gmail.com</h6>
                    </div>

                    <ul class="navbar-nav flex-grow-1 mt-4">
                        <li class="nav-item">
                            <a class="ps-2 nav-link active text-white border-bottom" href="#">Admin Dashboard</a>
                        </li>

                        <li class="nav-item">
                            <a class="ps-2 nav-link text-white border-bottom" href="#">Employee Details</a>
                        </li>

                        <li class="nav-item">
                            <a class="ps-2 nav-link text-white border-bottom" href="#">Departments Details</a>
                        </li>

                        <li class="nav-item dropdown border-bottom">
                            <a class="ps-2 nav-link dropdown-toggle text-white" href="#" role="button"
                                data-bs-toggle="dropdown">
                                Dropdown
                            </a>

                            <ul class="dropdown-menu" style="background-color:#CDCDFF;">
                                <li><a class="dropdown-item" href="#">Action</a></li>
                                <li><a class="dropdown-item" href="#">Another action</a></li>
                                <li>
                                    <hr class="dropdown-divider">
                                </li>
                                <li><a class="dropdown-item" href="#">Something else here</a></li>
                            </ul>
                        </li>
                    </ul>

                </div>
            </div>

        </div>
    </nav>
</body>

</html>
