<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Employee_login</title>
</head>

<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-5 shadow" style="width: 350px;">
            <h3 class="text-center mb-4">Login</h3>

            <div class="mb-4">
                <label class="form-label">Email</label>
                <input class="form-control" type="email" name="email" id="" placeholder="email or username">
            </div>

            <div class="mb-4">
                <label class="form-label">Password</label>
                <input class="form-control" type="password" name="password" id="" placeholder="password">

            </div>
        </div>
    </div>
</body>

</html>
