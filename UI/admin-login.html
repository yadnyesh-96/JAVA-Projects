<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <title>Employee_login</title>
    <title>Admin-Login</title>
</head>

<body>
    <div class="container vh-100 d-flex justify-content-center align-items-center">
        <div class="card p-4 shadow">
            <h3 class="text-center mb-4 f-bold">Admin Login</h3>
            <form action="">
                <div class="mb-4 ">
                    <label for="" class="form-label fw-semibold">Username :</label>
                    <input type="text" class="form-control" name="username" id="" placeholder="Username">
                </div>

                <div class="mb-4">
                    <label for="" class="form-label fw-semibold">Password :</label>
                    <input type="password" class="form-control" name="password" id="" placeholder="Password">
                </div>

                <button class="btn btn-primary w-100 mb-4">Login</button>

                <p class="text-center">
                    Don't have an account? contact<br>
                    <a href="sys_admin@emp.com">sysAdmin@emp.com</a>
                </p>
            </form>
        </div>
    </div>
</body>

</html>
