<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="./Style.css">
<title>Create-Account</title>
</head>

<body>
	<div class="container">

		<!-- heading -->
		<h1>Voter Registration</h1>

		<!-- input's -->

		<form action="RegisterVoter" method="post">

			<div class="input-area">
				<input type="text" name="name" placeholder="Enter Name" id="inp-1">
				<input type="number" name="age" placeholder="Age" id="inp-2">
				<input type="text" name="district" placeholder="District" id="inp-3">
				<input type="text" name="state" placeholder="State" id="inp-4">

				<input type="email" name="email" placeholder="Email" id="inp-5">
				<input type="password" name="password" placeholder="pasword"
					id="inp-6">

				<button id="btn-1">Submit</button>
			</div>

		</form>

	</div>
</body>

</html>
