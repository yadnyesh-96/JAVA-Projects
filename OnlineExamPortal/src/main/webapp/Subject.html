<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Subject</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<!-- Common Header -->
	<div id="header"></div>

	<div class="container py-5">

		<!-- Banner -->
		<div
			class="bg-primary text-white text-start rounded py-4 px-5 mb-4 shadow">
			<h2>Subject Management</h2>
			<p class="mb-0">Department of Online Examination</p>
		</div>

		<!-- Form Card -->
		<div class="card shadow">
			<div class="card-header bg-dark text-white">
				<h3 class="mb-0">Add Subject</h3>
				<small>Fill the details below to add a new subject.</small>
			</div>

			<div class="card-body">

				<form action="AddSubject" method="post">

					<!-- Subject Name -->
					<div class="mb-3">
						<label for="subject" class="form-label">Subject Name</label> <input
							type="text" class="form-control" id="subject" name="subject"
							placeholder="Enter Subject Name" required>
					</div>

					<!-- Description -->
					<div class="mb-4">
						<label for="description" class="form-label"> Subject
							Description </label>
						<textarea class="form-control" id="description" name="description"
							rows="5" placeholder="Enter Subject Description" required></textarea>
					</div>

					<!-- Buttons -->
					<div class="d-flex gap-2">

						<button type="submit" class="btn btn-success">Add Subject
						</button>

						<button type="reset" class="btn btn-secondary">Reset</button>

						<button type="button" class="btn btn-danger"
							onclick="history.back()">Cancel</button>

					</div>

				</form>

			</div>
		</div>

	</div>

	<script>
fetch("header.html")
    .then(response => response.text())
    .then(data => {
        document.getElementById("header").innerHTML = data;

        // Initialize Bootstrap dropdowns
        document.querySelectorAll(".dropdown-toggle").forEach(el => {
            new bootstrap.Dropdown(el);
        });
    });
</script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
