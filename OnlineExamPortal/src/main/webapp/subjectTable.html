<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List of Subjects</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<div id="header"></div>

	<div class="container py-5">


		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h2 class="mb-0 text-center">Subject List</h2>
			</div>

			<div class="card-body">

				<div class="table-responsive">
					<table id="table"
						class="table table-bordered table-hover table-striped align-middle">

						<thead class="table-dark">
							<tr>
								<th>ID</th>
								<th>Subject Name</th>
								<th>Subject Description</th>
								<th class="text-center">Action</th>
							</tr>
						</thead>

						<tbody id="tbody">

						</tbody>

					</table>
				</div>

			</div>
		</div>

	</div>

	<script>
	
	const params = new URLSearchParams(window.location.search);
	const msg = params.get("msg");
	
	if (msg === "deleted") {
	    alert("Subject removed successfully.");
	} else if (msg === "failed") {
	    alert("Subject removal failed.");
	}else if(msg === "success"){
		alert("Subject Updated successfully.");
	}
	
	
	fetch("/OnlineExamPortal/header.html")
	  .then(response => response.text())
	  .then(data => {
	    document.getElementById("header").innerHTML = data;
	  });
	
	
	
	
        fetch("/OnlineExamPortal/GetAllSubjects")
        .then(response => {

            if (!response.ok) {
                throw new Error("Failed to fetch data");
            }

            return response.json();
        })
        .then(data => {

            const tbody = document.getElementById("tbody");
            tbody.innerHTML = "";

            data.forEach(subject => {

                let row = document.createElement("tr");

                row.innerHTML = `
                    <td>${subject.subId}</td>
                    <td>${subject.subName}</td>
                    <td>${subject.subDesc}</td>
                    <td>
                    <div class="d-flex justify-content-center gap-2">

                        <a href="/OnlineExamPortal/UpdateSubject?subId=${subject.subId}"
                           class="btn text-dark btn-warning badge px-3">
                            Update
                        </a>

                        <a href="/OnlineExamPortal/deleteSubject?subId=${subject.subId}"
                           class="btn btn-danger badge px-3">
                            Delete
                        </a>

                    </div>
                </td>
                `;

                tbody.appendChild(row);

            });

        })
        .catch(error => {
            console.error(error);

            document.getElementById("tbody").innerHTML = `
                <tr>
                    <td colspan="3" class="text-center text-danger">
                        Failed to load subjects.
                    </td>
                </tr>
            `;
        });
    </script>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
