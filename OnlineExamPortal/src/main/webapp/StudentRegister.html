<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<div class="container mt-5">

		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h3 class="mb-0">Student Registration</h3>
			</div>

			<div class="card-body">

				<form action="registerStudent" method="post">

					<div class="row">

						<div class="col-md-6 mb-3">
							<label class="form-label">Full Name</label> <input type="text"
								class="form-control" name="full_name" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Email</label> <input type="email"
								class="form-control" name="email" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Mobile Number</label> <input
								type="text" class="form-control" name="mobile_number"
								maxlength="15" required>
						</div>

						<div class="col-md-12 mb-3">
							<label class="form-label">Address</label>
							<textarea class="form-control" name="address" rows="3" required></textarea>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Date of Birth</label> <input
								type="date" class="form-control" name="date_of_birth" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Select Subject For Exam</label> <select
								id="subjectDropdown" name="sub_id" class="form-select" required>
								<option value="">Loading Subjects...</option>
							</select>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Username</label> <input type="text"
								class="form-control" name="username" required>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Password</label> <input type="password"
								class="form-control" name="password" required>
						</div>

					</div>

					<button class="btn btn-success">Register Student</button>
					<button type="reset" class="btn btn-secondary">Reset</button>

					<button type="button" class="btn btn-danger"
						onclick="history.back()">Cancel</button>

				</form>

			</div>
		</div>

	</div>
	<script>
	const subjectDropdown = document.getElementById("subjectDropdown");

	fetch("/OnlineExamPortal/GetAllSubjects")
	    .then(response => {

	        if (!response.ok) {
	            throw new Error("Unable to fetch subjects");
	        }

	        return response.json();

	    })
	    .then(data => {

	        subjectDropdown.innerHTML =
	            '<option value="">-- Select Subject --</option>';

	        data.forEach(subject => {

	            const option = document.createElement("option");

	            option.value = subject.subId;      // This is sent to the servlet
	            option.textContent = subject.subName;

	            subjectDropdown.appendChild(option);

	        });

	    })
	    .catch(error => {

	        console.error(error);

	        subjectDropdown.innerHTML =
	            '<option value="">Failed to load subjects</option>';

	    });
	</script>

	<script src="student.js"></script>

</body>
</html>
