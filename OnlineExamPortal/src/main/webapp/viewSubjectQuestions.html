<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>List of Subjects</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<div id="header"></div>

	<div class="container py-5">


		<div class="card shadow">
			<div class="card-header bg-primary text-white">
				<h2 class="mb-0 text-center">Subject Question-Set List</h2>
			</div>

			<div class="card-body">


				<div class="mb-3">
					<label for="subject" class="form-label">Select Subject</label>

					<div class="row g-2 align-items-center">
						<div class="col">
							<select class="form-select" id="subject" name="subject">
								<option value="" selected disabled>-- Select Subject --</option>
							</select>
						</div>

						<div class="col-auto">
							<button id="showBtn" class="btn btn-primary">Show
								Questions</button>
						</div>
					</div>
				</div>


				<div class="table-responsive">
					<table id="table"
						class="table table-bordered table-hover table-striped align-middle">

						<thead class="table-dark">
							<tr>
								<th>Subject Name</th>
								<th>Question</th>
								<th class="text-center">Action</th>
							</tr>
						</thead>

						<tbody id="tbody">

						</tbody>

					</table>
				</div>

			</div>
		</div>

	</div>

	<script>

		// header purpose
            fetch("/OnlineExamPortal/header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });


        const subjectMap = {};

	// get subject details
        fetch("/OnlineExamPortal/GetAllSubjects")
            .then(response => {
                if (!response.ok) {
                    throw new Error("Failed to fetch subjects");
                }
                return response.json();
            })
            .then(data => {

                // Populate dropdown
                const subjectDropdown = document.getElementById("subject");

                data.forEach(subject => {
                	
                	subjectMap[subject.subId] = subject.subName;
                	
                    const option = document.createElement("option");
                    option.value = subject.subId;      	// ID in value
                    option.textContent = subject.subName; // Subject Name
                    subjectDropdown.appendChild(option);	
                });

            })
            .catch(error => {
                console.error(error);
            });
	
        
        document.getElementById("showBtn").addEventListener("click", function () {

        		
            const subId = document.getElementById("subject").value;
	
            if (!subId) {
                alert("Please select a subject.");
                return;
            }


            
            fetch("/OnlineExamPortal/GetAllQuestions?subId=" + subId)
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to fetch questions");
                    }
                    return response.json();
                })
                .then(data => {

                    const tbody = document.getElementById("tbody");
                    tbody.innerHTML = "";

                    data.forEach(question => {

                        let row = document.createElement("tr");

                        row.innerHTML = `
                            <tr>
                                <td>${subjectMap[question.subId]}</td>
                                <td>${question.question}</td>
                                <td>
                                    <a href="/OnlineExamPortal/UpdateQuestion?queId=${question.queId}"
                                       class="btn text-dark btn-warning badge px-3">
                              
                                        Update
                                    </a>

                                    <a href="/OnlineExamPortal/DeleteQuestion?queId=${question.queId}"
                                       class="btn btn-danger badge px-3">
                                        Delete
                                    </a>
                                </td>
                            </tr>
                        `;

                        tbody.appendChild(row);
                    });

                })
                .catch(error => console.error(error));

        });
    </script>

	<!-- Bootstrap JS -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
