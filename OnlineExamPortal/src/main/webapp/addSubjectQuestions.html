<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Subject</title>

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<!-- Common Header -->
	<div id="header"></div>

	<div class="container py-5">

		<!-- Form Card -->
		<div class="card shadow">
			<div class="card-header bg-dark text-white">
				<h3 class="mb-0">Add Question</h3>
				<small>Fill the details below to add a new Question for
					subjects.</small>
			</div>

			<div class="card-body">

				<form action="AddQuestion" method="post">

					<!-- Subject Name -->
					<div class="mb-3">
						<label for="subject" class="form-label">Select Subject</label>

						<div class="row g-2 align-items-center">
							<div class="col">
								<select class="form-select" id="subject" name="subId">
									<option value="" selected disabled>-- Select Subject
										--</option>
								</select>
							</div>

						</div>
					</div>

					<!-- Add Question -->
					<div class="mb-3">
						<label for="question" class="form-label">Question</label>
						<textarea class="form-control" id="question" name="question"
							rows="3" placeholder="Enter the question" required></textarea>
					</div>

					<!-- options -->
					<div class="mb-4" id="options">

						<label for="options" class="form-label fw-bold">Options</label>

						<div class="row g-3">

							<div class="col-md-6">
								<label for="option1" class="form-label">Option 1</label> <input
									type="text" class="form-control" name="option1" id="option1"
									placeholder="Enter Option 1" required>
							</div>

							<div class="col-md-6">
								<label for="option2" class="form-label">Option 2</label> <input
									type="text" class="form-control" name="option2" id="option2"
									placeholder="Enter Option 2" required>
							</div>

							<div class="col-md-6">
								<label for="option3" class="form-label">Option 3</label> <input
									type="text" class="form-control" name="option3" id="option3"
									placeholder="Enter Option 3" required>
							</div>

							<div class="col-md-6">
								<label for="option4" class="form-label">Option 4</label> <input
									type="text" class="form-control" name="option4" id="option4"
									placeholder="Enter Option 4" required>
							</div>
						</div>

					</div>

					<!-- select dropdown options -->
					<div class="mb-3">
						<label for="answer" class="form-label">Correct Answer</label> <select
							class="form-select" id="answer" name="answer" required>
							<option value="" selected disabled>-- Select Correct
								Option --</option>
							<option id="ans1"></option>
							<option id="ans2"></option>
							<option id="ans3"></option>
							<option id="ans4"></option>
						</select>
					</div>

					<!-- Buttons -->
					<div class="d-flex gap-2">

						<button type="submit" class="btn btn-success">Add Subject
						</button>

						<button type="reset" class="btn btn-secondary">Reset</button>

						<button type="button" class="btn btn-danger"
							onclick="history.back()">Cancel</button>

					</div>

				</form>

			</div>
		</div>

	</div>

	<script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;

                // Initialize Bootstrap dropdowns
                document.querySelectorAll(".dropdown-toggle").forEach(el => {
                    new bootstrap.Dropdown(el);
                });
            });

        
        // get subject list
        fetch("/OnlineExamPortal/GetAllSubjects")
        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to fetch subjects");
            }
            return response.json();
        })
        .then(data => {

            // Populate dropdown
            const subjectDropdown = document.getElementById("subject");

            data.forEach(subject => {
            	
            	
                const option = document.createElement("option");
                option.value = subject.subId;      	// ID in value
                option.textContent = subject.subName; // Subject Name
                subjectDropdown.appendChild(option);	
            });

        })
        .catch(error => {
            console.error(error);
        });
        

        const inputs = [
            document.getElementById("option1"),
            document.getElementById("option2"),
            document.getElementById("option3"),
            document.getElementById("option4")
        ];

        const options = [
            document.getElementById("ans1"),
            document.getElementById("ans2"),
            document.getElementById("ans3"),
            document.getElementById("ans4")
        ];

        inputs.forEach((input, index) => {
            input.addEventListener("input", () => {
                options[index].textContent = input.value;
                options[index].value = input.value;
            });
        });



        const answer = document.getElementById("answer");

        answer.addEventListener("change", function () {
            answer.value = this.value;
        });

        

    </script>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
