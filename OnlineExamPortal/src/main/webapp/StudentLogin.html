<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Login</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body class="bg-light">

	<div class="container">

		<div class="row justify-content-center align-items-center vh-100">

			<div class="col-md-5">

				<div class="card shadow-lg border-0">

					<div class="card-header bg-primary text-white text-center py-3">
						<h3 class="mb-0">
							<i class="fa-solid fa-user-graduate"></i> Student Login
						</h3>
					</div>

					<div class="card-body p-4">

						<form action="StudentLogin" method="post">

							<div class="mb-3">
								<label class="form-label"> Email or Username </label>

								<div class="input-group">
									<span class="input-group-text"> <i
										class="fa-solid fa-user"></i>
									</span> <input type="text" class="form-control" name="login"
										placeholder="Enter Email or Username" required>
								</div>
							</div>

							<div class="mb-4">
								<label class="form-label"> Password </label>

								<div class="input-group">
									<span class="input-group-text"> <i
										class="fa-solid fa-lock"></i>
									</span> <input type="password" class="form-control" name="password"
										placeholder="Enter Password" required>
								</div>
							</div>

							<div class="d-grid">
								<button type="submit" class="btn btn-primary">
									<i class="fa-solid fa-right-to-bracket"></i> Login
								</button>
							</div>

						</form>

					</div>

					<div class="card-footer text-center">
						<small class="text-muted"> Online Exam Portal - Student
							Login </small>
					</div>

				</div>

			</div>

		</div>

	</div>

</body>
</html>
