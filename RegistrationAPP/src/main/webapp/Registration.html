<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="CSS/Style.css">
<title>Create-Account</title>
</head>

<body>
	<div class="container">
		<form action="Registration" method="GET">

			<h1>Registration Form</h1>
			<p>Register and join our community be a part of our orgainization</p>

			<div class="inp-field">
				<label for="name">First Name :</label> <input type="text"
					name="first" id="" placeholder="First Name">
			</div>

			<div class="inp-field">
				<label for="name">Last Name :</label> <input type="text" name="last"
					id="" placeholder="Last Name">
			</div>

			<div class="inp-field">
				<label for="name">Email :</label> <input type="text" name="email"
					id="" placeholder="email">
			</div>

			<div class="inp-field">
				<label for="name">Username :</label> <input type="text"
					name="username" id="" placeholder="username">
			</div>

			<div class="inp-field">
				<label for="name">Password :</label> <input type="password"
					name="password" id="" placeholder="password">
			</div>

			<div class="inp-field">
				<button>Submit</button>
				<h2>
					<a href="">Login</a>
				</h2>
			</div>
		</form>
	</div>
</body>

</html>
